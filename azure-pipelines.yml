# Node.js
# Build a general Node.js project with pnpm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  batch: true
  branches:
    include:
      - master
      - develop

pr:
  autoCancel: true
  branches:
    include:
      - master
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  PNPM_HOME: $(Pipeline.Workspace)/.pnpm

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '24.x'
  displayName: 'Install Node.js'

# Backticks, not $(...): Azure expands its own $(var) macros in this script
# before bash sees it.
- script: |
    set -e
    export PNPM_VERSION=`node -p "require('./package.json').packageManager.split('@').pop().split('+')[0]"`
    curl -fsSL https://get.pnpm.io/install.sh | sh -
    echo "##vso[task.prependpath]$(PNPM_HOME)/bin"
  displayName: 'Install pnpm'

- script: pnpm install --frozen-lockfile
  displayName: 'pnpm install'

- script: pnpm run lint
  displayName: 'linting'

- script: pnpm run build
  displayName: 'building'

- script: pnpm run test
  displayName: 'run tests'
