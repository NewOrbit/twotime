minimumReleaseAge: 10080
trustPolicy: no-downgrade

# engines.node in package.json is a security floor. Without engineStrict pnpm
# installs on an older Node.js anyway; with it, pnpm install fails.
engineStrict: true

# trustPolicy compares by publish date, not semver, so an old major with no
# provenance reads as a downgrade from later, attested 7.x releases. semver@6.3.1
# is an ordinary 2023 release, reached via eslint-config-neworbit.
trustPolicyExclude:
    - semver@6.3.1
