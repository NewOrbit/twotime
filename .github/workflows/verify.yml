# Reusable verification job: the PR gate and the draft-release workflow both
# call it, so the checks cannot drift apart. It uploads the built bundle as an
# artifact so the release workflow packs the exact bytes that were tested.
name: verify

on:
    workflow_call:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Reads the version from the packageManager field in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Same order as prepublishOnly. build includes the type check.
            - run: pnpm run build
            - run: pnpm run test
            - run: pnpm run lint

            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/twotime.cjs
                  if-no-files-found: error
                  retention-days: 7
